version: 1

# Shared display-unit oneof. Not meant to be `extends`ed at a chart root:
# units belong to a plot, except on SingleValue, which has no per-plot concept
# at all - see the referencing site's own comment.
#
#   display_unit:
#     ref: common/display_unit.yml#display_unit
#     mapping:
#       path: ['displayUnit']
#
# The referencing site supplies mapping.path (deliberately absent below) and
# may override any other key; local keys win.
properties:
  display_unit:
    type: oneof
    at_least_one_of: [unit, prefix, suffix]
    description: >-
      How to scale and label displayed values: either a named unit (bits,
      bytes, or a time duration) or a custom prefix/suffix pair. Omit for no
      unit conversion or annotation.
    # the editor presents these as mutually exclusive: pick a named scaling
    # unit, or type a custom prefix/suffix pair. Both serialize to the same
    # displayUnit key - a bare unit string, or a {prefix, suffix} object.
    variants:
      unit:
        # The value list lives in common/scaling_unit.yml so this variant and
        # the per-series value_unit field cannot drift apart.
        ref: common/scaling_unit.yml#scaling_unit
      custom:
        type: block
        description: A literal prefix and/or suffix to attach to displayed values.
        properties:
          prefix:
            type: string
            optional: true
            description: Text shown immediately before each displayed value.
            mapping:
              path: ['prefix']
          suffix:
            type: string
            optional: true
            description: Text shown immediately after each displayed value.
            mapping:
              path: ['suffix']
